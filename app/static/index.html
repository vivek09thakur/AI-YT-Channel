<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI YT Channel</title>
<style>
:root {
  --font: system-ui, sans-serif;
  --text-xs: 12px; --text-sm: 13px; --text-base: 15px; --text-lg: 20px;
  --color-bg: #fff; --color-surface: #f4f4f5; --color-text: #111; --color-muted: #666;
  --color-border: #ddd; --color-accent: #2962ff; --color-on-accent: #fff;
  --color-success: #146c2e; --color-error: #c62828;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
  --radius: 4px; --radius-md: 8px; --control-h: 40px; --content-w: 640px;
  --col-options: 280px; --col-preview: minmax(320px, 32%);
  --motion: 150ms ease-out;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font: var(--text-base)/1.5 var(--font); color: var(--color-text); background: var(--color-bg); }
.shell { min-height: 100%; display: grid; grid-template-columns: var(--col-options) 1fr var(--col-preview); }
.shell > * { padding: var(--space-5) var(--space-4); }
.options { border-right: 1px solid var(--color-border); background: var(--color-surface); }
.preview { border-left: 1px solid var(--color-border); background: var(--color-surface); }
.main { display: grid; align-content: start; justify-items: center; }
.main > * { width: min(100%, var(--content-w)); }
.stack { display: grid; gap: var(--space-3); }
h1 { font-size: var(--text-lg); font-weight: 600; }
h2 { font-size: var(--text-sm); font-weight: 600; color: var(--color-muted); text-transform: uppercase; letter-spacing: .04em; }
.muted { font-size: var(--text-sm); color: var(--color-muted); }
.error-text { font-size: var(--text-sm); color: var(--color-error); }
label { font-size: var(--text-sm); color: var(--color-muted); }
.field { display: grid; gap: var(--space-1); }
input, select, textarea {
  width: 100%; min-height: var(--control-h); padding: var(--space-2) var(--space-3);
  font: inherit; color: inherit; background: var(--color-bg);
  border: 1px solid var(--color-border); border-radius: var(--radius);
}
textarea { resize: vertical; }
select { height: var(--control-h); }
[aria-invalid="true"] { border-color: var(--color-error); }
.check { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; font-size: var(--text-base); color: var(--color-text); cursor: pointer; }
.check input { width: 20px; min-height: 20px; height: 20px; margin: 0; accent-color: var(--color-accent); }
.actions { display: flex; gap: var(--space-2); }
.btn {
  min-height: var(--control-h); padding: 0 var(--space-4); font: inherit; font-weight: 600;
  border-radius: var(--radius); cursor: pointer; transition: background var(--motion), opacity var(--motion);
}
.btn-primary { flex: 1; color: var(--color-on-accent); background: var(--color-accent); border: 1px solid var(--color-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 88%, #000); }
.btn-secondary { color: var(--color-text); background: var(--color-bg); border: 1px solid var(--color-border); }
.btn-secondary:hover { background: var(--color-surface); }
.btn-link { display: grid; place-items: center; text-decoration: none; }
.btn:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.frame {
  aspect-ratio: 9 / 16; max-height: 60vh; margin: 0 auto; width: 100%;
  display: grid; place-items: center; text-align: center; padding: var(--space-4);
  border: 1px dashed var(--color-border); border-radius: var(--radius-md); background: var(--color-bg);
}
.frame video { width: 100%; height: 100%; object-fit: contain; border-radius: var(--radius); background: #000; }
.frame[data-state="done"] { border-style: solid; padding: 0; }
.status-line { font-weight: 600; }
.preview[data-state="done"] .status-line { color: var(--color-success); }
.preview[data-state="failed"] .status-line { color: var(--color-error); }
details { border-top: 1px solid var(--color-border); }
summary { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; font-size: var(--text-sm); color: var(--color-muted); cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸"; transition: transform var(--motion); }
details[open] > summary::before { transform: rotate(90deg); }
.log {
  max-height: 200px; overflow-y: auto; padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-bg);
  font: var(--text-xs)/1.6 ui-monospace, monospace; color: var(--color-muted); white-space: pre-wrap; word-break: break-word;
}
.log .error { color: var(--color-error); }
.log .success { color: var(--color-success); }
[hidden] { display: none !important; }
@media (max-width: 1024px) {
  .shell { grid-template-columns: 1fr; }
  .options, .preview { border: 0; border-top: 1px solid var(--color-border); }
  .main { order: 0; }
  .preview { order: 1; }
  .options { order: 2; }
  .frame { max-width: 360px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="options stack" aria-labelledby="optionsTitle">
    <h2 id="optionsTitle">Options</h2>
    <div class="field"><label for="model">Gemini model</label><select id="model" name="model" form="form"></select></div>
    <div class="field"><label for="voice">Voice</label><select id="voice" name="voice" form="form"></select></div>
    <div class="field"><label for="paragraphs">Paragraphs</label><input id="paragraphs" name="paragraphs" type="number" value="1" min="1" max="10" inputmode="numeric" form="form" /></div>
    <div class="field"><label for="position">Subtitle position</label><select id="position" name="position" form="form"></select></div>
    <div class="field"><label for="color">Subtitle colour</label><select id="color" name="color" form="form"></select></div>
    <label class="check"><input id="upload" name="upload" type="checkbox" form="form" /> Upload to YouTube as private</label>
    <p id="configWarning" class="error-text" hidden></p>
  </aside>

  <main class="main">
    <form id="form" class="stack" novalidate>
      <div>
        <h1>AI YT Channel</h1>
        <p class="muted">Turn a topic into a narrated Short with stock footage and subtitles.</p>
      </div>
      <div class="field">
        <label for="subject">Topic</label>
        <textarea id="subject" name="subject" rows="5" placeholder="Why octopuses have three hearts" required aria-describedby="subjectError"></textarea>
        <p id="subjectError" class="error-text" hidden>Enter a topic to generate a video.</p>
      </div>
      <div class="field">
        <label for="custom_prompt">Custom prompt <span class="muted">— optional, replaces the default script prompt</span></label>
        <textarea id="custom_prompt" name="custom_prompt" rows="3" placeholder="Write the script as a mystery that is solved in the last line"></textarea>
      </div>
      <div class="actions">
        <button id="generate" class="btn btn-primary" type="submit">Generate</button>
        <button id="cancel" class="btn btn-secondary" type="button" hidden>Cancel</button>
      </div>
    </form>
  </main>

  <aside id="preview" class="preview stack" aria-labelledby="previewTitle" data-state="empty">
    <h2 id="previewTitle">Preview</h2>
    <div id="frame" class="frame" data-state="empty">
      <p id="frameText" class="muted">No video yet. Generate one to preview it here.</p>
      <video id="video" controls playsinline hidden></video>
    </div>
    <div role="status" aria-live="polite">
      <p id="statusLine" class="status-line" hidden></p>
      <p id="statusDetail" class="muted" hidden></p>
    </div>
    <a id="download" class="btn btn-secondary btn-link" hidden>Download video</a>
    <details id="logWrap" hidden>
      <summary>Log</summary>
      <div id="log" class="log"></div>
    </details>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>
