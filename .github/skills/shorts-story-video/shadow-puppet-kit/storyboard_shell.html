<meta charset="utf-8">
<title>Kauwa Shadow Play Storyboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=block">
<style>
  /* layout: a single column of wide panels on narrow screens, two columns from 1100px; captions under each frame */
  :root {
    --bg: #1a0d07; --panel: #24130a; --ink: #f4e3c4; --muted: #c7a77c; --lamp: #f0a24a; --rule: #4a2a16;
    --display: "IM Fell English", Georgia, serif; --body: "Libre Baskerville", Georgia, serif;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
  .wrap { max-width: 1500px; margin: 0 auto; padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { display: grid; gap: 6px; margin-bottom: 28px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lamp); }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 5vw, 54px); line-height: 1.05; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); max-width: 70ch; margin: 0; }
  #grid { display: grid; grid-template-columns: 1fr; gap: 28px; }
  @media (min-width: 1100px) { #grid { grid-template-columns: 1fr 1fr; } }
  .panel { margin: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; min-width: 0; }
  .panel canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; max-width: 100%; background: #000; }
  figcaption { padding: 16px 18px 20px; display: grid; gap: 10px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px; }
  .num { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--lamp); }
  .name { font-family: var(--display); font-size: 26px; line-height: 1.1; }
  .time { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: 9.5em 1fr; gap: 6px 14px; }
  dt { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
  dd { margin: 0; min-width: 0; }
  .screen { font-family: var(--display); font-size: 19px; color: var(--lamp); }
  .vo { font-style: italic; color: var(--muted); }
  @media (max-width: 560px) { dl { grid-template-columns: 1fr; } dt { padding-top: 6px; } }
  section.assumed { margin-top: 40px; border-top: 1px solid var(--rule); padding-top: 22px; }
  section.assumed h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0 0 10px; }
  section.assumed ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; max-width: 90ch; }
</style>
<div class="wrap">
  <header>
    <span class="eyebrow">R16 · Storyboard · Shadow Puppet Theatre · 60.3 s</span>
    <h1>Kauwa kabhi nahi bhoolta</h1>
    <p class="sub">Nine key frames, drawn with the same code the animation will use. Times come from the voiceover's word timings; every visual lands on its word (leading it by 0.1 s).</p>
  </header>
  <div id="grid"></div>
  <section class="assumed">
    <h2>Assumed facts and choices</h2>
    <ul id="assumed"></ul>
  </section>
</div>
