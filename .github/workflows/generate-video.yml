name: Generate story video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic / title of the story (e.g. "Shiva drinks the poison: Neelkanth")'
        required: true
        type: string
      script:
        description: 'Narration text. Sentences are split automatically; use " / " or a blank line between paragraphs. Leave empty to use script_file.'
        required: false
        type: string
      script_file:
        description: 'Path of a .txt in this repo with the narration (alternative to script), e.g. scripts/shiva.txt'
        required: false
        type: string
      formats:
        description: 'Which video(s) to render (shorts = 9:16 only, landscape = 16:9 only; one format halves render minutes)'
        required: true
        type: choice
        default: both
        options: [both, shorts, landscape]
      voice:
        description: 'Narration voice (neural)'
        required: true
        type: choice
        default: en-US-AndrewNeural
        options: [en-US-AndrewNeural, en-US-GuyNeural, en-US-AvaNeural, en-GB-RyanNeural, en-GB-SoniaNeural, en-IN-PrabhatNeural, en-IN-NeerjaNeural]
      provider:
        description: 'LLM that writes the scene code (auto = first working key, free tiers first)'
        required: true
        type: choice
        default: auto
        options: [auto, gemini, mistral, cerebras, meta, openrouter, openai, anthropic]
      model:
        description: 'Model override (defaults: gemini-3.8-flash, mistral-large-latest, qwen-3-coder-480b, muse-spark-1.3, anthropic/claude-sonnet-4, gpt-4.1, claude-sonnet-4-20250514)'
        required: false
        type: string
      notes:
        description: 'Optional notes for the illustrator LLM (characters, colours, moments to show)'
        required: false
        type: string

concurrency:
  group: generate-video
  cancel-in-progress: false

permissions:
  contents: write

env:
  KIT: .github/skills/folk-art-video

jobs:
  author:
    name: Voice + scene code
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
      matrix: ${{ steps.formats.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with: { ffmpeg-version: release }
      - name: Install tools
        timeout-minutes: 10
        run: |
          pip install -q -r pipeline/requirements.txt -r pipeline/folk/requirements.txt
      - name: Slug
        id: slug
        run: |
          slug=$(printf '%s' "$TOPIC" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          echo "slug=${slug:-story}" >> "$GITHUB_OUTPUT"
        env:
          TOPIC: ${{ inputs.topic }}
      - name: Render matrix from formats input
        id: formats
        run: |
          # thumb.jpg is grabbed from the first rendered format
          case "$FORMATS" in
            shorts)    m='[{"format":"shorts","thumb":"--thumb"}]' ;;
            landscape) m='[{"format":"landscape","thumb":"--thumb"}]' ;;
            *)         m='[{"format":"landscape","thumb":"--thumb"},{"format":"shorts","thumb":""}]' ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "rendering: $m"
        env:
          FORMATS: ${{ inputs.formats }}
      - name: Check LLM providers (keys, quota, credits)
        id: llm
        run: python pipeline/check_keys.py --prefer "${{ inputs.provider }}" --model "$MODEL"
        env:
          MODEL: ${{ inputs.model }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          META_AI_API: ${{ secrets.META_AI_API }}
      - name: Prepare script
        run: |
          mkdir -p work
          if [ -n "$SCRIPT_FILE" ]; then cp "$SCRIPT_FILE" work/script.txt
          else printf '%s\n' "$SCRIPT_INPUT" > work/script.txt; fi
          test -s work/script.txt || { echo "::error::no script given (script or script_file)"; exit 1; }
          wc -w work/script.txt
        env:
          SCRIPT_INPUT: ${{ inputs.script }}
          SCRIPT_FILE: ${{ inputs.script_file }}
      - name: Voice (neural TTS)
        run: python pipeline/tts.py --script work/script.txt --voice "${{ inputs.voice }}" --out work
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
      - name: Phrase timeline
        run: python pipeline/folk/phrases.py --narration work/narration.json --out work/phrases.json
      - name: Scene code (LLM, validated by rendering sample frames in both aspects)
        run: |
          python pipeline/folk/generate_folk.py --topic "$TOPIC" --narration work/narration.json --phrases work/phrases.json --kit "$KIT" \
            --slug "${{ steps.slug.outputs.slug }}" --provider "${{ steps.llm.outputs.provider }}" --model "${{ steps.llm.outputs.model }}" --notes "$NOTES"
        env:
          CI: 'true'
          TOPIC: ${{ inputs.topic }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          META_AI_API: ${{ secrets.META_AI_API }}
          NOTES: ${{ inputs.notes }}
      - name: Upload story bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story
          retention-days: 7
          if-no-files-found: ignore
          path: |
            work/voice.wav
            work/voice.mp3
            work/narration.json
            work/phrases.json
            work/script.txt
            ${{ env.KIT }}/stories/${{ steps.slug.outputs.slug }}/
      - name: Commit story code to main (re-renderable)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scripts && cp work/script.txt "scripts/${{ steps.slug.outputs.slug }}.txt"
          git add "$KIT/stories/${{ steps.slug.outputs.slug }}" "scripts/${{ steps.slug.outputs.slug }}.txt"
          git commit -m "story: ${{ steps.slug.outputs.slug }} (run ${{ github.run_number }})" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"

  render:
    name: Render ${{ matrix.format }}
    needs: author
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.author.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with: { name: story, path: bundle }
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with: { ffmpeg-version: release }
      - name: Install tools
        timeout-minutes: 10
        run: |
          pip install -q -r pipeline/folk/requirements.txt
          nproc
      - name: Place story files
        run: |
          slug="${{ needs.author.outputs.slug }}"
          mkdir -p "$KIT/stories/$slug" work
          cp -r "bundle/$KIT/stories/$slug/." "$KIT/stories/$slug/"
          cp bundle/work/voice.wav work/
          test -s "$KIT/stories/$slug/story.py" && test -s "$KIT/stories/$slug/phrases.json"
      - name: Render frames + soundtrack + encode
        run: |
          python pipeline/folk/render_folk.py --story "$KIT/stories/${{ needs.author.outputs.slug }}" --voice work/voice.wav \
            --aspect "${{ matrix.format }}" --out out --kit "$KIT" ${{ matrix.thumb }}
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of default=nw=1 "out/${{ matrix.format }}.mp4"
        env:
          FOLK_SS: '2'
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.format }}
          retention-days: 30
          path: |
            out/${{ matrix.format }}.mp4
            out/thumb.jpg
            out/sheet_${{ matrix.format }}.jpg

  publish:
    name: Publish to videos branch
    needs: [author, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { path: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with: { name: story, path: bundle }
      - uses: actions/download-artifact@v4
        with: { pattern: 'video-*', merge-multiple: true, path: final }
      - name: Collect
        run: |
          slug="${{ needs.author.outputs.slug }}"
          cp bundle/work/voice.mp3 bundle/work/narration.json final/
          cp "bundle/$KIT/stories/$slug/meta.json" final/ || true
          ls -la final
      - name: Checkout videos branch
        run: |
          git clone --depth 1 --branch videos "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site 2>/dev/null \
            || { git init site && cd site && git checkout -b videos && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
      - name: Add video + rebuild overview
        run: |
          python main/pipeline/publish.py --root site --src final --slug "${{ needs.author.outputs.slug }}" --run "${{ github.run_number }}" \
            --repo "${{ github.repository }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "video: ${{ needs.author.outputs.slug }} (run ${{ github.run_number }})"
          git push origin videos
      - name: Summary
        run: |
          slug="${{ needs.author.outputs.slug }}"; dir="videos/${slug}-${{ github.run_number }}"
          raw="https://github.com/${{ github.repository }}/raw/videos/$dir"
          {
            echo "## Video ready: $slug"
            echo
            echo "| Format | Download |"; echo "|---|---|"
            [ -f final/landscape.mp4 ] && echo "| YouTube landscape (1920x1080) | [$dir/landscape.mp4]($raw/landscape.mp4) |"
            [ -f final/shorts.mp4 ] && echo "| YouTube Shorts (1080x1920) | [$dir/shorts.mp4]($raw/shorts.mp4) |"
            echo
            echo "Overview page: https://github.com/${{ github.repository }}/blob/videos/README.md (or enable GitHub Pages on the videos branch for index.html)"
            echo
            echo "Story code committed to \`${{ env.KIT }}/stories/$slug/\` on \`${{ github.ref_name }}\` (folk-art engine); re-render any time with \`python pipeline/folk/render_folk.py --story $KIT/stories/$slug --voice voice.wav --aspect shorts\`."
          } >> "$GITHUB_STEP_SUMMARY"
