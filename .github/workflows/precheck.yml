name: Pre-run check only

# Runs just the quota gate (AI keys, Actions minutes, TTS) without generating anything. ~1 minute.

on:
  workflow_dispatch:
    inputs:
      formats:
        description: 'Planned story formats (sets the minutes estimate)'
        required: true
        type: choice
        default: both
        options: [both, shorts, landscape]

permissions:
  contents: read

jobs:
  precheck:
    name: Pre-run check (AI, runner, TTS quota)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q -r pipeline/requirements.txt
      - name: Check quotas
        run: |
          case "$FORMATS" in both) n=90 ;; *) n=55 ;; esac
          python pipeline/precheck.py --need-minutes "$n" --prefer auto --voice en-US-AndrewNeural
        env:
          FORMATS: ${{ inputs.formats }}
          BILLING_TOKEN: ${{ secrets.BILLING_TOKEN }}
          ACTIONS_INCLUDED_MINUTES: ${{ vars.ACTIONS_INCLUDED_MINUTES }}
          ACTIONS_ALLOW_OVERAGE: ${{ vars.ACTIONS_ALLOW_OVERAGE }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          META_AI_API: ${{ secrets.META_AI_API }}
