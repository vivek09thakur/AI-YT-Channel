name: Generate stickman fact reel

# Daily: an LLM looks at the facts already on the videos branch (stickman.json), picks a fresh surprising fact, writes
# the 30-45 s narration (hook question -> answer right away -> why -> subscribe/follow), the kit renders
# it as a stick-figure animation (Remotion), publishes to stickman/<slug>-<run> and uploads to the accounts of group
# "stickman". By hand: same, or give your own topic / script.
# Own kit (.github/skills/stickman-reel), own scripts (pipeline/stick/), own concurrency group, own folder + index on
# the videos branch. Nothing here touches the other workflows.

on:
  schedule:
    # 2 reels a day: each slot runs only while fewer than 2 were published today (guard job); the last slot
    # is a retry for a failed earlier run and never produces a third one.
    - cron: '30 7 * * *'   # 13:00 IST
    - cron: '30 13 * * *'  # 19:00 IST
    - cron: '30 16 * * *'  # 22:00 IST retry slot
  workflow_dispatch:
    inputs:
      topic:
        description: 'Fact title / hook question. Leave EMPTY to let the LLM pick the next fact from what was published before'
        required: false
        type: string
      script:
        description: 'Narration text (optional, empty = LLM writes it). Paragraphs separated by blank lines: hook question, answer, 2-4 explanation lines, subscribe/follow line.'
        required: false
        type: string
      script_file:
        description: 'Path of a .txt in this repo with the narration (alternative to script). Past scripts are kept on the videos branch under scripts/stickman/'
        required: false
        type: string
      theme:
        description: 'Auto mode only: steer the pick, e.g. "space" or "Indian history"'
        required: false
        type: string
      voice:
        description: 'Neural voice'
        required: true
        type: choice
        default: en-GB-RyanNeural
        options: [en-GB-RyanNeural, en-GB-SoniaNeural, en-US-AndrewNeural, en-US-GuyNeural, en-US-AvaNeural, en-IN-PrabhatNeural, en-IN-NeerjaNeural]
      page_name:
        description: 'Page / channel name shown as a small pill at the top (empty = no watermark)'
        required: false
        type: string
      provider:
        description: 'LLM that writes the fact and the scene code (auto = first working key, free tiers first)'
        required: true
        type: choice
        default: auto
        options: [auto, gemini, mistral, cerebras, meta, openrouter, openai, anthropic]
      model:
        description: 'Model override (defaults: gemini-3.8-flash, mistral-large-latest, qwen-3-coder-480b, muse-spark-1.3, anthropic/claude-sonnet-4, gpt-4.1, claude-sonnet-4-20250514)'
        required: false
        type: string
      notes:
        description: 'Optional notes for the scene writer (the fact, objects to draw); auto mode writes its own'
        required: false
        type: string
      upload:
        description: 'Upload after publishing: auto = every account allowed for group "stickman" (YT_USERn_FOR / IG_USERn_FOR), off = only publish'
        required: true
        type: choice
        default: auto
        options: [auto, off]
      yt_privacy:
        description: 'YouTube privacy for uploads'
        required: true
        type: choice
        default: public
        options: [public, unlisted, private]
      cta:
        description: 'Closing line appended to the captions'
        required: false
        type: string
        default: 'If you like knowing facts like this, subscribe and follow for more.'

concurrency:
  group: generate-stickman-reel
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  DAILY_TARGET: '2'   # scheduled videos per day (guard job)
  KIT: .github/skills/stickman-reel
  PROJECT: work/reel
  PYTHONUNBUFFERED: '1'
  # scheduled runs have no inputs: these are the defaults used then
  VOICE: ${{ inputs.voice || 'en-GB-RyanNeural' }}
  PROVIDER: ${{ inputs.provider || 'auto' }}
  UPLOAD: ${{ inputs.upload || 'auto' }}
  YT_PRIVACY: ${{ inputs.yt_privacy || 'public' }}
  CTA_LINE: ${{ inputs.cta || 'If you like knowing facts like this, subscribe and follow for more.' }}
  PAGE_NAME: ${{ inputs.page_name || '' }}

jobs:
  # Daily target: a scheduled slot only does work while fewer than DAILY_TARGET reels were published today, so a
  # failed slot is picked up by the next one. Manual runs always go.
  guard:
    name: Daily target reached?
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; echo "manual run - go"; exit 0; fi
          python pipeline/published_today.py --repo "${{ github.repository }}" --index stickman.json --max "${DAILY_TARGET:-2}"

  precheck:
    name: Pre-run check (AI, runner, TTS quota)
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      provider: ${{ steps.check.outputs.provider }}
      model: ${{ steps.check.outputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q -r pipeline/requirements.txt
      - name: Check quotas
        id: check
        # author ~12 min + Remotion render ~15 min + publish/upload ~5 min
        run: python pipeline/precheck.py --need-minutes 35 --prefer "$PROVIDER" --model "$MODEL" --voice "$VOICE"
        env:
          MODEL: ${{ inputs.model }}
          BILLING_TOKEN: ${{ secrets.BILLING_TOKEN }}
          ACTIONS_INCLUDED_MINUTES: ${{ vars.ACTIONS_INCLUDED_MINUTES }}
          ACTIONS_ALLOW_OVERAGE: ${{ vars.ACTIONS_ALLOW_OVERAGE }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          META_AI_API: ${{ secrets.META_AI_API }}

  author:
    name: Fact + voice + scene code
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
      topic: ${{ steps.topic.outputs.topic }}
      total: ${{ steps.narr.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.KIT }}/template/package-lock.json
      - name: ffmpeg (preinstalled on ubuntu-latest, apt fallback)
        run: command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }; ffmpeg -version | head -1
      - name: Install tools
        timeout-minutes: 10
        run: |
          pip install -q -r pipeline/stick/requirements.txt
          mkdir -p "$PROJECT" && rsync -a --exclude node_modules --exclude out --exclude public "$KIT/template/" "$PROJECT/"
          cd "$PROJECT" && npm ci --silent
          google-chrome --version
      - name: Previously published facts (videos branch index)
        if: inputs.topic == '' && inputs.script == '' && inputs.script_file == ''
        run: |
          mkdir -p site
          curl -fsSL -o site/stickman.json -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/stickman.json?ref=videos" \
            && python -c "import json;d=json.load(open('site/stickman.json'));print(len(d),'published');[print(' -',e.get('date',''),e.get('title',''),'->',e.get('fact','')) for e in d[:10]]" \
            || echo "no stickman.json yet (first fact)"
      - name: Pick the next fact + write the narration (LLM)
        id: pick
        if: inputs.topic == '' && inputs.script == '' && inputs.script_file == ''
        run: |
          mkdir -p work
          python pipeline/stick/pick_fact.py --out work --used site/stickman.json --provider "${{ needs.precheck.outputs.provider }}" \
            --model "${{ needs.precheck.outputs.model }}" --theme "$THEME" --notes "$NOTES"
        env:
          LLM_TIMEOUT: '120'
          THEME: ${{ inputs.theme }}
          NOTES: ${{ inputs.notes }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          META_AI_API: ${{ secrets.META_AI_API }}
      - name: Topic
        id: topic
        run: |
          topic="${PICKED:-$INPUT}"
          test -n "$topic" || { echo "::error::no topic: give one, or leave topic AND script empty for auto mode"; exit 1; }
          echo "topic=$topic" >> "$GITHUB_OUTPUT"
          echo "notes=${PICKED_NOTES:-$INPUT_NOTES}" >> "$GITHUB_OUTPUT"
          echo "topic: $topic"
        env:
          PICKED: ${{ steps.pick.outputs.topic }}
          PICKED_NOTES: ${{ steps.pick.outputs.notes }}
          INPUT: ${{ inputs.topic }}
          INPUT_NOTES: ${{ inputs.notes }}
      - name: Slug
        id: slug
        run: |
          slug=$(printf '%s' "$TOPIC" | iconv -f utf-8 -t ascii//TRANSLIT 2>/dev/null | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          [ -n "$slug" ] || slug="fact-$(date -u +%Y%m%d-%H%M)"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "slug: $slug"
        env:
          TOPIC: ${{ steps.topic.outputs.topic }}
      - name: Prepare script
        run: |
          mkdir -p work
          if [ -s work/script.txt ]; then echo "using the LLM-written script"
          elif [ -n "$SCRIPT_FILE" ]; then cp "$SCRIPT_FILE" work/script.txt
          else printf '%s\n' "$SCRIPT_INPUT" > work/script.txt; fi
          test -s work/script.txt || { echo "::error::no script: give script / script_file, or leave topic AND script empty for auto mode"; exit 1; }
          wc -w work/script.txt
        env:
          SCRIPT_INPUT: ${{ inputs.script }}
          SCRIPT_FILE: ${{ inputs.script_file }}
      - name: Narration (neural TTS)
        id: narr
        run: |
          python pipeline/tts.py --script work/script.txt --voice "$VOICE" --out work
          total=$(python -c "import json;print(json.load(open('work/narration.json'))['duration'])")
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "TOTAL = $total s"
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
      - name: Prepare project assets (fonts, sfx, voice, rms)
        run: |
          cd "$PROJECT"
          node prepare.mjs "${{ steps.narr.outputs.total }}"
          cp ../voice.mp3 public/voice.mp3
          python tools/make_rms.py public/voice.mp3 src/rms.json
      - name: Scene code (LLM, checked with tsc + headless Chrome stills + motion check)
        run: |
          python pipeline/stick/generate_stick_reel.py --topic "$TOPIC" --narration work/narration.json --project "$PROJECT" --kit "$KIT" \
            --slug "${{ steps.slug.outputs.slug }}" --page-name "$PAGE_NAME" --notes "$NOTES" \
            --provider "${{ needs.precheck.outputs.provider }}" --model "${{ needs.precheck.outputs.model }}" --chrome "$(which google-chrome)"
        env:
          CI: 'true'
          LLM_TIMEOUT: '180'
          TOPIC: ${{ steps.topic.outputs.topic }}
          NOTES: ${{ steps.topic.outputs.notes }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          META_AI_API: ${{ secrets.META_AI_API }}
      - name: Upload fact bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fact-bundle
          retention-days: 7
          if-no-files-found: ignore
          path: |
            work/voice.mp3
            work/narration.json
            work/script.txt
            work/pick.json
            ${{ env.KIT }}/facts/${{ steps.slug.outputs.slug }}/
            ${{ env.PROJECT }}/debug/sheet.png
      - name: Commit scene code to main (re-renderable)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KIT/facts/${{ steps.slug.outputs.slug }}"
          git commit -m "fact reel: ${{ steps.slug.outputs.slug }} (run ${{ github.run_number }})" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"

  render:
    name: Render 9:16 reel
    needs: author
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.KIT }}/template/package-lock.json
      - uses: actions/download-artifact@v4
        with: { name: fact-bundle, path: bundle }
      - name: ffmpeg (preinstalled on ubuntu-latest, apt fallback)
        run: command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }; ffmpeg -version | head -1
      - name: Install tools
        timeout-minutes: 10
        run: |
          pip install -q numpy
          mkdir -p "$PROJECT" && rsync -a --exclude node_modules --exclude out --exclude public "$KIT/template/" "$PROJECT/"
          cd "$PROJECT" && npm ci --silent
      - name: Place fact files
        run: |
          slug="${{ needs.author.outputs.slug }}"
          cp "bundle/$KIT/facts/$slug/data.ts" "bundle/$KIT/facts/$slug/scenes.tsx" "bundle/$KIT/facts/$slug/brand.ts" "$PROJECT/src/"
          cd "$PROJECT"
          node prepare.mjs "${{ needs.author.outputs.total }}"
          cp ../../bundle/work/voice.mp3 public/voice.mp3
          python tools/make_rms.py public/voice.mp3 src/rms.json
          npx tsc --noEmit
      - name: Render with Remotion (headless Chrome)
        run: |
          cd "$PROJECT"
          npx remotion render src/index.ts StoryVideo out/reel.mp4 --codec h264 --crf 20 --overwrite \
            --concurrency "$(nproc)" --gl swangle --browser-executable "$(which google-chrome)" --log warn
          ls -la out
      - name: Finalize (h264 + loudnorm + thumbnail)
        run: |
          python pipeline/stick/finalize_reel.py --in "$PROJECT/out/reel.mp4" --out final/reel.mp4 --thumb final/thumb.jpg --total "${{ needs.author.outputs.total }}"
      - uses: actions/upload-artifact@v4
        with:
          name: fact-video
          retention-days: 30
          path: |
            final/reel.mp4
            final/thumb.jpg

  publish:
    name: Publish to videos branch
    needs: [precheck, author, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { path: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with: { name: fact-bundle, path: bundle }
      - uses: actions/download-artifact@v4
        with: { name: fact-video, path: final }
      - name: Collect
        run: |
          slug="${{ needs.author.outputs.slug }}"
          cp bundle/work/voice.mp3 bundle/work/narration.json final/
          cp "bundle/$KIT/facts/$slug/meta.json" final/ || echo '{}' > final/meta.json
          ls -la final
      - run: pip install -q -r main/pipeline/requirements.txt
      - name: Captions + hashtags (LLM, falls back to the description)
        run: |
          python main/pipeline/folk/captions.py --meta final/meta.json --script bundle/work/script.txt --topic "$TOPIC" \
            --slug "${{ needs.author.outputs.slug }}" --cta "$CTA" --provider "${{ needs.precheck.outputs.provider }}" \
            --base-tags "#didyouknow,#facts,#funfacts,#science,#stickman,#animation,#shorts"
          echo; cat final/caption_youtube.txt
        env:
          LLM_TIMEOUT: '120'
          TOPIC: ${{ needs.author.outputs.topic }}
          CTA: ${{ env.CTA_LINE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          META_AI_API: ${{ secrets.META_AI_API }}
      - name: Upload bundle for the upload job
        uses: actions/upload-artifact@v4
        with:
          name: fact-final
          retention-days: 7
          path: |
            final/reel.mp4
            final/thumb.jpg
            final/meta.json
      - name: Checkout videos branch
        run: |
          git clone --depth 1 --branch videos "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site 2>/dev/null \
            || { git init site && cd site && git checkout -b videos && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
      - name: Add reel + script + rebuild stickman overview
        run: |
          mkdir -p site/scripts/stickman && cp bundle/work/script.txt "site/scripts/stickman/${{ needs.author.outputs.slug }}-${{ github.run_number }}.txt"
          python main/pipeline/stick/publish_reel.py --root site --src final --slug "${{ needs.author.outputs.slug }}" --run "${{ github.run_number }}" \
            --repo "${{ github.repository }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fact reel: ${{ needs.author.outputs.slug }} (run ${{ github.run_number }})"
          ok=0
          for i in 1 2 3; do
            if git push origin videos; then ok=1; break; fi
            git pull --rebase origin videos || true; sleep 5
          done
          test "$ok" = 1 || { echo "::error::could not push to the videos branch after 3 tries"; exit 1; }
      - name: Summary
        run: |
          slug="${{ needs.author.outputs.slug }}"; dir="stickman/${slug}-${{ github.run_number }}"
          raw="https://github.com/${{ github.repository }}/raw/videos/$dir"
          {
            echo "## Fact reel ready: $slug"
            echo
            echo "| Format | Download |"; echo "|---|---|"
            echo "| Reel 9:16 (1080x1920, ${{ needs.author.outputs.total }} s) | [$dir/reel.mp4]($raw/reel.mp4) |"
            echo
            echo "Overview: https://github.com/${{ github.repository }}/blob/videos/stickman/README.md"
            echo
            echo "Scene code committed to \`${{ env.KIT }}/facts/$slug/\` on \`${{ github.ref_name }}\`; copy data.ts/scenes.tsx/brand.ts into the template's src/ to re-render."
          } >> "$GITHUB_STEP_SUMMARY"

  # Uploads go to accounts allowed for group "stickman" (YT_USERn_FOR / IG_USERn_FOR secrets).
  # Re-run by hand with the "Upload video" workflow and folder stickman/<slug>-<run>.
  upload:
    name: Upload reel
    needs: [author, publish]
    if: ${{ inputs.upload != 'off' }}
    uses: ./.github/workflows/upload-video.yml
    secrets: inherit
    with:
      artifact: fact-final
      folder: ${{ format('stickman/{0}-{1}', needs.author.outputs.slug, github.run_number) }}
      video: reel.mp4
      group: stickman
      platforms: youtube,instagram
      yt_kind: short
      upload: ${{ inputs.upload || 'auto' }}
      yt_privacy: ${{ inputs.yt_privacy || 'public' }}

  report:
    name: Report
    needs: [guard, precheck, author, render, publish, upload]
    if: ${{ always() && needs.guard.outputs.go == 'true' }}
    uses: ./.github/workflows/report-failure.yml
    with:
      workflow: Generate stickman fact reel
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
      detail: ${{ needs.precheck.result == 'failure' && 'precheck' || needs.author.result == 'failure' && 'author' || needs.render.result == 'failure' && 'render' || needs.publish.result == 'failure' && 'publish' || needs.upload.result == 'failure' && 'upload' || '' }}
