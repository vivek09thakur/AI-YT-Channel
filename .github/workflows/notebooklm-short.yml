name: NotebookLM short (auto topic)

# Fully automatic: picks a random unpublished topic from pipeline/notebooklm/topics.json (science, technology, ai, space,
# physics), lets NotebookLM research it on the web, generates a 9:16 Video Overview and publishes it to the videos branch
# under nlm/. Independent of the other workflows: own scripts (pipeline/notebooklm/), own index (nlm.json), own folder.
# Jobs: precheck (token present + works, quota, leftover notebooks, upload targets) -> make -> publish -> upload (optional:
# YouTube Short / Instagram Reel, only for platforms whose secrets are set; see pipeline/notebooklm/README.md).
#
# One-time setup (see pipeline/notebooklm/README.md): with a DEDICATED/throwaway Google account run
#   pip install "notebooklm-py[headless,browser]"
#   notebooklm login --master-token --account you@gmail.com
# and store ~/.notebooklm/profiles/default/master_token.json as the repo secret NOTEBOOKLM_MASTER_TOKEN_JSON.

on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST daily
  workflow_dispatch:
    inputs:
      genre:
        description: 'Topic pool (auto = random genre)'
        required: true
        type: choice
        default: auto
        options: [auto, science, technology, ai, space, physics]
      topic:
        description: 'Exact topic to use instead of a random pick (optional)'
        required: false
        type: string
      research_mode:
        description: 'Web research depth (deep is slower and uses more NotebookLM quota)'
        required: true
        type: choice
        default: fast
        options: [fast, deep]
      format:
        description: 'Video Overview format: short = ~60 s vertical 9:16; explainer / cinematic = 16:9'
        required: true
        type: choice
        default: short
        options: [short, explainer, cinematic]
      style:
        description: 'Visual style (explainer only; ignored for short / cinematic)'
        required: true
        type: choice
        default: auto
        options: [auto, classic, whiteboard, kawaii, anime, watercolor, retro-print, heritage, paper-craft]
      publish:
        description: 'Publish to the videos branch (off = artifact only)'
        required: true
        type: boolean
        default: true
      keep_notebook:
        description: 'Keep the NotebookLM notebook after download (off = delete it to keep the account tidy)'
        required: true
        type: boolean
        default: false
      upload:
        description: 'Upload to YouTube / Instagram (auto = every platform whose secrets are set; off = skip)'
        required: true
        type: choice
        default: auto
        options: [auto, 'off']
      yt_privacy:
        description: 'YouTube privacy for the uploaded Short'
        required: true
        type: choice
        default: public
        options: [public, unlisted, private]

concurrency:
  group: notebooklm-short
  cancel-in-progress: false

permissions:
  contents: write

env:
  GENRE: ${{ inputs.genre || 'auto' }}
  TOPIC_OVERRIDE: ${{ inputs.topic || '' }}
  RESEARCH_MODE: ${{ inputs.research_mode || 'fast' }}
  FORMAT: ${{ inputs.format || 'short' }}
  STYLE: ${{ inputs.style || 'auto' }}
  KEEP_NOTEBOOK: ${{ inputs.keep_notebook == true && '1' || '' }}
  UPLOAD: ${{ inputs.upload || 'auto' }}
  YT_PRIVACY: ${{ inputs.yt_privacy || 'public' }}
  # Closing call to action spoken at the end of every video (edit here to change the wording).
  CTA_LINE: "If you learned something new, support us by subscribing to the channel and following us for more."

jobs:
  precheck:
    name: Precheck (token, quota, leftovers, upload targets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      yt: ${{ steps.targets.outputs.yt }}
      ig: ${{ steps.targets.outputs.ig }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Master token secret present and valid JSON
        env:
          NOTEBOOKLM_MASTER_TOKEN_JSON: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN_JSON }}
        run: |
          test -n "$NOTEBOOKLM_MASTER_TOKEN_JSON" || { echo "::error::secret NOTEBOOKLM_MASTER_TOKEN_JSON is not set (see pipeline/notebooklm/README.md)"; exit 1; }
          python -c "import json,os; d=json.loads(os.environ['NOTEBOOKLM_MASTER_TOKEN_JSON']); assert isinstance(d, dict) and d, 'empty'" \
            || { echo "::error::NOTEBOOKLM_MASTER_TOKEN_JSON is not a JSON object - paste the whole master_token.json file"; exit 1; }
          echo "master token secret: present"

      - name: Install notebooklm-py
        run: pip install -q "notebooklm-py[headless]" && notebooklm --version

      - name: Master token works (mint session + network test)
        env:
          NOTEBOOKLM_MASTER_TOKEN_JSON: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN_JSON }}
        run: |
          umask 077
          mkdir -p ~/.notebooklm/profiles/default
          printf '%s' "$NOTEBOOKLM_MASTER_TOKEN_JSON" > ~/.notebooklm/profiles/default/master_token.json
          chmod 600 ~/.notebooklm/profiles/default/master_token.json
          unset NOTEBOOKLM_MASTER_TOKEN_JSON
          notebooklm login --master-token-refresh || notebooklm auth refresh --verify
          notebooklm auth check --test --json | tee work_auth.json
          python -c "import json,sys; d=json.load(open('work_auth.json')); sys.exit(0 if d.get('status')=='ok' else 1)" \
            || { echo "::error::NotebookLM auth failed - re-mint the master token (notebooklm login --master-token)"; exit 1; }
          rm -f work_auth.json

      - name: Quota check
        run: |
          notebooklm usage --json > usage.json || { echo "::warning::usage meter unavailable"; echo '{}' > usage.json; }
          python - <<'PY'
          import json
          d = json.load(open('usage.json'))
          if d.get('status') != 'ready':
              print('usage meter:', d.get('status', 'unknown'), '- continuing')
              raise SystemExit(0)
          for w in d.get('windows', []):
              print(f"{w['kind']}: {w.get('used_percent', 0):.1f}% used, resets {w.get('resets_at')}")
          if d.get('is_exhausted'):
              print('::error::NotebookLM compute quota exhausted for this account')
              raise SystemExit(1)
          PY

      - name: Sweep leftover notebooks from earlier runs
        if: env.KEEP_NOTEBOOK == ''
        run: |
          notebooklm list --json > notebooks.json || echo '[]' > notebooks.json
          python pipeline/notebooklm/sweep_notebooks.py --notebooks notebooks.json --topics pipeline/notebooklm/topics.json > sweep.txt
          cat sweep.txt
          while read -r id; do
            [ -n "$id" ] && { notebooklm delete -n "$id" -y --json >/dev/null && echo "deleted leftover notebook $id" || echo "::warning::could not delete leftover notebook $id"; }
          done < <(grep '^DELETE ' sweep.txt | cut -d' ' -f2)

      - name: Detect upload targets
        id: targets
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          yt=false; ig=false
          if [ "$UPLOAD" = "off" ]; then
            echo "upload: off (workflow input)"
          else
            if [ -n "$YT_CLIENT_ID" ] && [ -n "$YT_CLIENT_SECRET" ] && [ -n "$YT_REFRESH_TOKEN" ]; then yt=true; echo "YouTube upload: enabled (privacy $YT_PRIVACY)";
            else echo "::notice::YouTube upload skipped - set secrets YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN to enable"; fi
            if [ -n "$IG_USER_ID" ] && [ -n "$IG_ACCESS_TOKEN" ]; then ig=true; echo "Instagram upload: enabled";
            else echo "::notice::Instagram upload skipped - set secrets IG_USER_ID, IG_ACCESS_TOKEN to enable"; fi
          fi
          echo "yt=$yt" >> "$GITHUB_OUTPUT"; echo "ig=$ig" >> "$GITHUB_OUTPUT"

      - name: Remove credentials
        if: always()
        run: rm -rf ~/.notebooklm

  make:
    name: Research + Video Overview
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      slug: ${{ steps.pick.outputs.slug }}
      topic: ${{ steps.pick.outputs.topic }}
      genre: ${{ steps.pick.outputs.genre }}
      duration: ${{ steps.probe.outputs.duration }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with: { ffmpeg-version: release }
      - name: Install notebooklm-py
        run: |
          pip install -q "notebooklm-py[headless]"
          notebooklm --version

      - name: Authenticate (master token -> session)
        env:
          NOTEBOOKLM_MASTER_TOKEN_JSON: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN_JSON }}
        run: |
          test -n "$NOTEBOOKLM_MASTER_TOKEN_JSON" || { echo "::error::secret NOTEBOOKLM_MASTER_TOKEN_JSON is not set (see pipeline/notebooklm/README.md)"; exit 1; }
          umask 077
          mkdir -p ~/.notebooklm/profiles/default
          printf '%s' "$NOTEBOOKLM_MASTER_TOKEN_JSON" > ~/.notebooklm/profiles/default/master_token.json
          chmod 600 ~/.notebooklm/profiles/default/master_token.json
          unset NOTEBOOKLM_MASTER_TOKEN_JSON
          notebooklm login --master-token-refresh || notebooklm auth refresh --verify
          notebooklm auth check --test --json | tee work_auth.json
          python -c "import json,sys; d=json.load(open('work_auth.json')); sys.exit(0 if d.get('status')=='ok' else 1)" \
            || { echo "::error::NotebookLM auth failed - re-mint the master token"; exit 1; }
          rm -f work_auth.json

      - name: Fetch published index (to avoid repeats)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/videos/nlm.json" -o nlm.json \
            || { echo "no nlm.json on videos branch yet"; echo '[]' > nlm.json; }

      - name: Pick topic
        id: pick
        run: python pipeline/notebooklm/pick_topic.py --topics pipeline/notebooklm/topics.json --genre "$GENRE" --used nlm.json --topic "$TOPIC_OVERRIDE"

      - name: Create notebook + web research
        id: nb
        run: |
          notebooklm create "${{ steps.pick.outputs.topic }}" --use --json | tee create.json
          nb=$(python -c "import json;d=json.load(open('create.json'));print(d.get('active_notebook_id') or d.get('notebook',{}).get('id') or d.get('id') or '')")
          test -n "$nb" || { echo "::error::could not read notebook id"; cat create.json; exit 1; }
          echo "id=$nb" >> "$GITHUB_OUTPUT"
          echo "notebook: $nb"
          notebooklm source add-research "${{ steps.pick.outputs.topic }}" --mode "$RESEARCH_MODE" --from web --import-all --timeout 900 --retry 3 --json | tee research.json
          notebooklm source list --json > sources.json || echo '[]' > sources.json
          n=$(python -c "import json;d=json.load(open('sources.json'));r=d.get('sources',d) if isinstance(d,dict) else d;print(len(r) if isinstance(r,list) else 0)")
          echo "sources imported: $n"
          [ "$n" -gt 0 ] || { echo "::error::research imported no sources"; exit 1; }

      - name: Generate Video Overview
        run: |
          prompt="Make this for a general YouTube Shorts audience about the topic: ${{ steps.pick.outputs.topic }}. Follow this exact three-part structure. PART 1 - HOOK (first 3 seconds): open by asking the audience one short, intriguing question about the topic, for example 'Have you ever wondered...' or 'What if...'. Do not start with a statement or a title. PART 2 - EXPLANATION: answer that question clearly and step by step in simple everyday language, one idea at a time, with a concrete example or comparison, so a beginner fully understands it. PART 3 - CLOSING (last few seconds): give a one-line takeaway, then end by speaking this call to action word for word: '$CTA_LINE'. Keep the whole thing conversational and energetic."
          args=(--format "$FORMAT" --wait --timeout 2400 --retry 3 --json)
          if [ "$FORMAT" = "explainer" ]; then args+=(--style "$STYLE"); fi
          notebooklm generate video "$prompt" "${args[@]}" | tee generate.json
          python - <<'PY'
          import json
          d = json.load(open('generate.json'))
          st = str(d.get('status', '')).lower()
          print('generate status:', st or d)
          if st and st not in ('completed', 'complete', 'done', 'ready', 'success'):
              raise SystemExit(f'::error::video generation ended with status {st}')
          PY

      - name: Download + thumbnail + metadata
        id: probe
        run: |
          mkdir -p final
          notebooklm download video final/reel.mp4 --latest --force --json | tee download.json
          test -s final/reel.mp4 || { echo "::error::download produced no file"; exit 1; }
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 final/reel.mp4)
          echo "duration=$dur" >> "$GITHUB_OUTPUT"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 final/reel.mp4
          ffmpeg -v error -y -ss 1 -i final/reel.mp4 -frames:v 1 -q:v 3 final/thumb.jpg
          notebooklm ask --json "Return ONLY a JSON object with keys title (catchy YouTube Shorts title phrased as a question, max 60 characters), description (2 sentences explaining what the viewer will learn, followed by this exact sentence: 'Subscribe and follow us for more.') and hashtags (array of 12 lowercase single-word tags without #, most relevant first)." > ask.json \
            || echo '{}' > ask.json
          python pipeline/notebooklm/make_meta.py --topic "${{ steps.pick.outputs.topic }}" --genre "${{ steps.pick.outputs.genre }}" \
            --slug "${{ steps.pick.outputs.slug }}" --format "$FORMAT" --ask ask.json --sources sources.json --notebook "${{ steps.nb.outputs.id }}" \
            --cta "$CTA_LINE" --out final/meta.json
          echo "--- caption_youtube.txt ---"; cat final/caption_youtube.txt; echo; echo "--- caption_instagram.txt ---"; cat final/caption_instagram.txt; echo
          ls -la final

      - uses: actions/upload-artifact@v4
        with:
          name: nlm-short
          retention-days: 30
          path: final/

      - name: Delete notebook
        if: always() && steps.nb.outputs.id != '' && env.KEEP_NOTEBOOK == ''
        run: notebooklm delete -n "${{ steps.nb.outputs.id }}" -y --json || echo "::warning::could not delete notebook ${{ steps.nb.outputs.id }}"

      - name: Remove credentials
        if: always()
        run: rm -rf ~/.notebooklm

  publish:
    name: Publish to videos branch
    needs: make
    if: ${{ inputs.publish != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { path: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with: { name: nlm-short, path: final }
      - name: Checkout videos branch
        run: |
          git clone --depth 1 --branch videos "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site 2>/dev/null \
            || { git init site && cd site && git checkout -b videos && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
      - name: Add short + rebuild nlm overview
        run: |
          python main/pipeline/notebooklm/publish_nlm.py --root site --src final --slug "${{ needs.make.outputs.slug }}" --run "${{ github.run_number }}" \
            --duration "${{ needs.make.outputs.duration }}" \
            --repo "${{ github.repository }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "notebooklm short: ${{ needs.make.outputs.slug }} (run ${{ github.run_number }})"
          for i in 1 2 3; do git push origin videos && break || { git pull --rebase origin videos; sleep 5; }; done
      - name: Summary
        run: |
          slug="${{ needs.make.outputs.slug }}"; dir="nlm/${slug}-${{ github.run_number }}"
          raw="https://github.com/${{ github.repository }}/raw/videos/$dir"
          title=$(python -c "import json;print(json.load(open('final/meta.json')).get('title',''))")
          {
            echo "## NotebookLM short ready: $title"
            echo
            echo "- Genre: ${{ needs.make.outputs.genre }}"
            echo "- Topic: ${{ needs.make.outputs.topic }}"
            echo "- Length: ${{ needs.make.outputs.duration }} s, format: $FORMAT"
            echo
            echo "| Download | Link |"; echo "|---|---|"
            echo "| Video | [$dir/reel.mp4]($raw/reel.mp4) |"
            echo "| Thumbnail | [$dir/thumb.jpg]($raw/thumb.jpg) |"
            echo
            echo "Overview: https://github.com/${{ github.repository }}/blob/videos/nlm/README.md"
          } >> "$GITHUB_STEP_SUMMARY"

  upload:
    name: Upload (YouTube / Instagram, optional)
    needs: [precheck, make, publish]
    # publish may be skipped (publish=false) - still upload if the video was made and at least one target is configured
    if: ${{ !cancelled() && needs.make.result == 'success' && (needs.precheck.outputs.yt == 'true' || needs.precheck.outputs.ig == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with: { name: nlm-short, path: final }

      - name: Upload to YouTube
        id: yt
        if: needs.precheck.outputs.yt == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          pip install -q google-api-python-client google-auth
          python pipeline/notebooklm/upload_youtube.py --video final/reel.mp4 --meta final/meta.json --privacy "$YT_PRIVACY" --out yt.json
          echo "url=$(python -c "import json;print(json.load(open('yt.json')).get('url',''))")" >> "$GITHUB_OUTPUT"

      - name: Upload to Instagram (Reel)
        id: ig
        if: needs.precheck.outputs.ig == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.facebook.com' }}
        run: |
          # The Graph API needs a PUBLIC video URL. Use the videos-branch raw URL when the repo is public,
          # otherwise park the file for ~1 h on tmpfiles.org (the reel is about to be public anyway).
          url=""
          if [ "${{ needs.publish.result }}" = "success" ]; then
            raw="https://github.com/${{ github.repository }}/raw/videos/nlm/${{ needs.make.outputs.slug }}-${{ github.run_number }}/reel.mp4"
            curl -fsSLI -o /dev/null "$raw" && url="$raw" && echo "using repo raw URL"
          fi
          if [ -z "$url" ]; then
            url=$(curl -fsS -F "file=@final/reel.mp4" https://tmpfiles.org/api/v1/upload | python -c "import json,sys;u=json.load(sys.stdin)['data']['url'];print(u.replace('tmpfiles.org/','tmpfiles.org/dl/',1))")
            echo "using temporary public host"
          fi
          test -n "$url" || { echo "::error::no public URL for the video"; exit 1; }
          python pipeline/notebooklm/upload_instagram.py --video-url "$url" --meta final/meta.json --out ig.json
          echo "url=$(python -c "import json;print(json.load(open('ig.json')).get('permalink',''))")" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Uploads"
            echo
            echo "| Platform | Result |"; echo "|---|---|"
            [ "${{ needs.precheck.outputs.yt }}" = "true" ] && echo "| YouTube | ${{ steps.yt.outcome }} ${{ steps.yt.outputs.url }} |" || echo "| YouTube | skipped (secrets not set) |"
            [ "${{ needs.precheck.outputs.ig }}" = "true" ] && echo "| Instagram | ${{ steps.ig.outcome }} ${{ steps.ig.outputs.url }} |" || echo "| Instagram | skipped (secrets not set) |"
            echo
            echo "<details><summary>YouTube caption</summary>"; echo; echo '```'; cat final/caption_youtube.txt; echo; echo '```'; echo "</details>"
            echo "<details><summary>Instagram caption</summary>"; echo; echo '```'; cat final/caption_instagram.txt; echo; echo '```'; echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
